[project]
name = "maritime-sar-aes-rarr"
version = "0.1.0"
description = "Uncertainty-Aware Multi-Victim Prioritization for Maritime Search and Rescue (AES-RARR Framework)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "DAP Research Team" }
]
keywords = ["maritime", "search-and-rescue", "UAV", "evidential-deep-learning", "uncertainty"]
license = { text = "MIT" }

dependencies = [
    # Core scientific stack
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    # Computer Vision & Detection
    "opencv-python>=4.9",
    "pillow>=10.3",
    "ultralytics>=8.2",          # YOLOv8 / YOLOv11
    # Deep Learning (optional – falls back to NumPy if absent)
    "torch>=2.2; sys_platform != 'none'",
    "torchvision>=0.17; sys_platform != 'none'",
    # Tracking
    "filterpy>=1.4",             # Kalman filter primitives
    # Jupyter / EDA
    "jupyter>=1.0",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.22",
    # Dataset access
    "kagglehub>=0.3",
    # LaTeX / reporting
    "requests>=2.31",
    # Routing / optimisation
    "networkx>=3.3",
    "ortools>=9.9",
    # Utilities
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "rich>=13.7",
    "typer>=0.12",
    "torch>=2.12.0",
    "streamlit>=1.58.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[tool.uv]
# This is a scripts workspace, not an installable package
package = false

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

# No build-system needed — this is a scripts-only workspace
